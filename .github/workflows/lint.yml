name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flake8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install "flake8>=7.0.0" "black>=24.0.0"

      # Driven off the tracked file list
      - name: Run black
        run: black --check --diff $(git ls-files '*.py')

      - name: Run flake8
        run: flake8 .
