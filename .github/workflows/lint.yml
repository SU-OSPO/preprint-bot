name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flake8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # flake8 only parses the source, so the project's own dependencies are
      # not needed — this job stays fast and independent of the test jobs.
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install "flake8>=7.0.0"

      - name: Run flake8
        run: flake8 .
