{% load static %}
{# Server values for the paper manager; the logic lives in the static JS. #}
{# `sources` maps a source name to its label and its request spacing, so the #}
{# add loop paces itself per source instead of hardcoding arXiv's 3s. #}
<script>
  window.PAPER_MANAGER = {
    scriptPrefix: "{{ SCRIPT_PREFIX|escapejs }}",
    perPage: {{ search_per_page|default:10 }},
    sources: {
      {% for s in paper_sources %}"{{ s.name|escapejs }}": {label: "{{ s.label|escapejs }}", delayMs: {{ s.delay_ms|default:0 }}, canAdd: {{ s.supports_add_by_id|yesno:"true,false" }}}{% if not forloop.last %},{% endif %}
      {% endfor %}
    }
  };
</script>
<script src="{% static 'core/paper_manager.js' %}" defer></script>
